name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Script self-checks
        run: |
          python3 scripts/score_eval.py --check
          python3 scripts/export_archive.py --check
          python3 scripts/build_vocabulary.py --check
          python3 scripts/bakeoff_deepgram.py --check
